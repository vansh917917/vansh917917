<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" width="100%" height="100%">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    @keyframes border-glow {
      0%, 100% { filter: drop-shadow(0px 0px 4px rgba(54, 188, 247, 0.4)); }
      50% { filter: drop-shadow(0px 0px 10px rgba(54, 188, 247, 0.8)); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-320px); }
      100% { transform: translateY(320px); }
    }
    .grid {
      stroke: #36bcf7;
      stroke-width: 0.5;
      opacity: 0.1;
    }
    .neon-border {
      stroke: #36bcf7;
      stroke-width: 2;
      animation: border-glow 4s ease-in-out infinite;
    }
    .radar-circle {
      transform-origin: 100px 160px;
      animation: spin 10s linear infinite;
    }
    .radar-sweep {
      transform-origin: 100px 160px;
      animation: spin 4s linear infinite;
      opacity: 0.25;
    }
    .terminal-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      fill: #eaeaea;
    }
    .terminal-header {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #36bcf7;
      letter-spacing: 2px;
    }
    .cyan-text {
      fill: #36bcf7;
      font-weight: bold;
    }
    .cursor {
      animation: blink 1s step-end infinite;
      fill: #36bcf7;
    }
    .scan {
      fill: url(#scan-gradient);
      opacity: 0.04;
      animation: scanline 6s linear infinite;
    }
    .ping {
      fill: #36bcf7;
      animation: blink 1.5s ease-in-out infinite;
    }
  </style>

  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36bcf7" stop-opacity="0" />
      <stop offset="50%" stop-color="#36bcf7" stop-opacity="1" />
      <stop offset="100%" stop-color="#36bcf7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="830" height="320" rx="8" fill="url(#bg-gradient)" />
  <rect width="830" height="320" rx="8" fill="url(#grid-pattern)" />
  <rect width="830" height="320" rx="8" class="scan" />

  <!-- Terminal Window Frame -->
  <rect x="5" y="5" width="820" height="310" rx="6" fill="none" class="neon-border" />
  
  <!-- Window Header Bar -->
  <line x1="5" y1="35" x2="825" y2="35" stroke="#36bcf7" stroke-width="1" opacity="0.3" />
  <circle cx="20" cy="20" r="5" fill="#ff5f56" />
  <circle cx="36" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="20" r="5" fill="#27c93f" />
  <text x="415" y="23" text-anchor="middle" class="terminal-header">SYS.LOG // VANSH_GUPTA_OS v4.0</text>
  <text x="800" y="23" text-anchor="end" class="terminal-header" style="animation: pulse 2s infinite;">[ ACTIVE ]</text>

  <!-- Radar HUD (Left Side Panel) -->
  <g transform="translate(10, 0)">
    <!-- Radar concentric circles -->
    <circle cx="100" cy="160" r="70" fill="none" stroke="#36bcf7" stroke-width="0.5" opacity="0.2" />
    <circle cx="100" cy="160" r="50" fill="none" stroke="#36bcf7" stroke-width="0.5" opacity="0.3" />
    <circle cx="100" cy="160" r="30" fill="none" stroke="#36bcf7" stroke-width="0.5" opacity="0.4" />
    
    <!-- Crosshairs -->
    <line x1="25" y1="160" x2="175" y2="160" stroke="#36bcf7" stroke-width="0.5" opacity="0.3" />
    <line x1="100" y1="85" x2="100" y2="235" stroke="#36bcf7" stroke-width="0.5" opacity="0.3" />
    
    <!-- Rotating Sweep -->
    <path d="M 100 160 L 100 90 A 70 70 0 0 1 170 160 Z" fill="none" stroke="#36bcf7" stroke-width="0" opacity="0.3" class="radar-sweep" style="fill: url(#scan-gradient);" />
    
    <!-- Rotating Rings -->
    <circle cx="100" cy="160" r="60" fill="none" stroke="#36bcf7" stroke-width="1.5" stroke-dasharray="10 40 20 10" class="radar-circle" />
    <circle cx="100" cy="160" r="40" fill="none" stroke="#36bcf7" stroke-width="1" stroke-dasharray="5 15" class="radar-circle" style="animation-direction: reverse; animation-duration: 5s;" />

    <!-- Static radar points (target locks) -->
    <circle cx="130" cy="130" r="3" class="ping" />
    <circle cx="80" cy="190" r="2" class="ping" style="animation-delay: 0.5s;" />
    
    <!-- Coordinates readout -->
    <text x="100" y="255" text-anchor="middle" class="terminal-header" style="font-size: 8px;">LOC: 12.2958 N / 76.6394 E</text>
  </g>

  <!-- Divider Line -->
  <line x1="210" y1="35" x2="210" y2="315" stroke="#36bcf7" stroke-width="1" opacity="0.3" />

  <!-- Terminal Output Content (Right Panel) -->
  <g transform="translate(230, 45)">
    <!-- Terminal Lines -->
    <text x="10" y="25" class="terminal-text"><tspan class="cyan-text">$</tspan> whoami</text>
    <text x="10" y="50" class="terminal-text">vansh_gupta <tspan class="cyan-text">[AI &amp; Systems Engineer]</tspan></text>
    
    <text x="10" y="85" class="terminal-text"><tspan class="cyan-text">$</tspan> cat active_cores.json</text>
    <text x="10" y="110" class="terminal-text">{</text>
    <text x="30" y="130" class="terminal-text">"NIEdge": <tspan class="cyan-text">"1.1K+ users | 27K+ views [ONLINE]"</tspan>,</text>
    <text x="30" y="150" class="terminal-text">"AlphaEngineX": <tspan class="cyan-text">"Concurrent Volatility Engine [LOADED]"</tspan></text>
    <text x="10" y="170" class="terminal-text">}</text>

    <text x="10" y="205" class="terminal-text"><tspan class="cyan-text">$</tspan> status --check</text>
    <text x="10" y="230" class="terminal-text">Concurrency: OK // UUIDv4 Idempotency: ACTIVE</text>
    
    <text x="10" y="265" class="terminal-text"><tspan class="cyan-text">$</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
