<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 26" width="220" height="26">
  <style>
    .btn-frame {
      fill: #0a0c10;
      stroke: #36bcf7;
      stroke-width: 1.5;
      transition: all 0.2s ease-in-out;
    }
    .btn-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #36bcf7;
      letter-spacing: 1.5px;
      transition: all 0.2s ease-in-out;
      font-weight: bold;
    }
    svg:hover .btn-frame {
      fill: #36bcf7;
      filter: drop-shadow(0px 0px 5px rgba(54, 188, 247, 0.8));
      cursor: pointer;
    }
    svg:hover .btn-text {
      fill: #0a0c10;
      cursor: pointer;
    }
  </style>
  <rect x="1" y="1" width="218" height="24" rx="4" class="btn-frame" />
  <text x="110" y="17" text-anchor="middle" class="btn-text">CONNECT VIA LINKEDIN</text>
</svg>
