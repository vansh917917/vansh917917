      <rect width="565" height="168" rx="12" fill="#0C1426" stroke="rgba(34,211,238,0.28)">
        <animate attributeName="stroke" values="rgba(34,211,238,0.22);rgba(34,211,238,0.5);rgba(34,211,238,0.22)" dur="4.5s" begin="0.35s" repeatCount="indefinite"/>
