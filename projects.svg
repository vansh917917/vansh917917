        <text x="25" y="13" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="bold">Redis</text>
      </g>
      <g transform="translate(274, 122)">
        <rect width="55" height="18" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="27.5" y="13" font-size="9" fill="#2496ED" text-anchor="middle" font-weight="bold">Docker</text>
      </g>
      <g transform="translate(337, 122)">
