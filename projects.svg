<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="240" viewBox="0 0 1180 240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Projects">
<rect width="1180" height="240" fill="#0A101F" rx="10"/>
<defs>
<linearGradient id="acc_dark" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite"/></stop>
  <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<text x="15" y="22" font-size="12" letter-spacing="2" fill="#22D3EE" font-weight="bold">PROJECTS.LIST</text>
<text x="145" y="22" font-size="11" fill="#475569">./projects.sh --all</text>
<line x1="15" y1="32" x2="1165" y2="32" stroke="url(#acc_dark)" stroke-width="1.5" opacity="0.7"/>

<!-- Card 1: NIEdge -->
<a href="https://niedge.vercel.app" target="_blank">
  <g opacity="0" transform="translate(15, 50)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.25s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="5s" begin="0.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <rect width="565" height="168" rx="12" fill="#0C1426" stroke="rgba(34,211,238,0.28)">
        <animate attributeName="stroke" values="rgba(34,211,238,0.22);rgba(34,211,238,0.5);rgba(34,211,238,0.22)" dur="4.5s" begin="0.25s" repeatCount="indefinite"/>
      </rect>
      <!-- Header bar -->
      <rect width="565" height="30" rx="12" fill="#0B1222"/>
      <rect y="18" width="565" height="12" fill="#0B1222"/>
      <line x1="0" y1="30" x2="565" y2="30" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="19" font-size="11" fill="#94A3B8" font-weight="bold"><tspan fill="#22D3EE">&#8226;</tspan> vansh917917/NIEdge</text>
      <!-- Active dot -->
      <circle cx="545" cy="15" r="3.5" fill="#10B981"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      
      <!-- Icon (Book/Graduation Cap) -->
      <g transform="translate(20, 50)" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20v4H6.5a2.5 2.5 0 0 1-2.5-2.5z"/>
        <path d="M6 2v15"/>
        <path d="M12 6h5"/>
        <path d="M12 10h5"/>
      </g>
      
      <!-- Text details -->
      <text x="75" y="65" font-size="12" fill="#F8FAFC" font-weight="bold">Academic Resource Engine</text>
      <text x="75" y="85" font-size="11" fill="#94A3B8" xml:space="preserve">High-traction student academic resource platform.</text>
      <text x="75" y="103" font-size="11" fill="#94A3B8" xml:space="preserve">Serving 1.2K+ total users &amp; 28K+ views.</text>
      
      <!-- Tech stack badges -->
      <g transform="translate(75, 122)">
        <rect width="65" height="18" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
        <text x="32.5" y="13" font-size="9" fill="#F9FAFB" text-anchor="middle" font-weight="bold">Next.js</text>
      </g>
      <g transform="translate(148, 122)">
        <rect width="55" height="18" rx="4" fill="#23272F" stroke="rgba(255,255,255,0.1)"/>
        <text x="27.5" y="13" font-size="9" fill="#14B8A6" text-anchor="middle" font-weight="bold">React</text>
      </g>
      <g transform="translate(211, 122)">
        <rect width="70" height="18" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.1)"/>
        <text x="35" y="13" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="bold">Firebase</text>
      </g>
      <g transform="translate(289, 122)">
        <rect width="80" height="18" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
        <text x="40" y="13" font-size="9" fill="#38BDF8" text-anchor="middle" font-weight="bold">TailwindCSS</text>
      </g>
    </g>
  </g>
</a>

<!-- Card 2: AlphaEngineX -->
<a href="https://alphaenginex.vercel.app" target="_blank">
