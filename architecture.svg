<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="100%" height="100%">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    @keyframes border-glow {
      0%, 100% { filter: drop-shadow(0px 0px 3px rgba(54, 188, 247, 0.4)); }
      50% { filter: drop-shadow(0px 0px 8px rgba(54, 188, 247, 0.7)); }
    }
    @keyframes flow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes node-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0px 0px 2px rgba(54, 188, 247, 0.3)); }
      50% { transform: scale(1.03); filter: drop-shadow(0px 0px 6px rgba(54, 188, 247, 0.6)); }
    }
    .neon-border {
      stroke: #36bcf7;
      stroke-width: 1.5;
      animation: border-glow 4s ease-in-out infinite;
    }
    .grid {
      stroke: #36bcf7;
      stroke-width: 0.5;
      opacity: 0.08;
    }
    .flow-line {
      stroke: #36bcf7;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      animation: flow 1.2s linear infinite;
      opacity: 0.6;
    }
    .flow-line-reverse {
      stroke: #36bcf7;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      animation: flow 1.2s linear infinite;
      animation-direction: reverse;
      opacity: 0.6;
    }
    .static-line {
      stroke: #36bcf7;
      stroke-width: 1;
      opacity: 0.2;
    }
    .node-bg {
      fill: #0a0c10;
      stroke: #36bcf7;
      stroke-width: 1.5;
      transition: all 0.3s ease-in-out;
    }
    .node-group:hover .node-bg {
      fill: #36bcf7;
      stroke: #36bcf7;
      filter: drop-shadow(0px 0px 10px rgba(54, 188, 247, 0.8));
      cursor: pointer;
    }
    .node-group:hover .node-icon {
      fill: #0a0c10;
      cursor: pointer;
    }
    .node-group:hover .node-label {
      fill: #36bcf7;
      font-weight: bold;
      cursor: pointer;
    }
    .node-icon {
      fill: #36bcf7;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
    }
    .node-label {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #eaeaea;
      transition: all 0.3s ease-in-out;
    }
    .terminal-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #eaeaea;
    }
    .terminal-header {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #36bcf7;
      letter-spacing: 2px;
    }
    .console-box {
      fill: #0a0c10;
      stroke: #36bcf7;
      stroke-width: 1;
      opacity: 0.5;
    }
    .default-text {
      opacity: 1;
      transition: opacity 0.2s ease;
      fill: #36bcf7;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .info-panel {
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    /* Hide default text when any node is hovered */
    svg:hover #default-info {
      opacity: 0;
    }
    /* Show specific panel on hover */
    #node-client:hover ~ #info-client,
    #node-gateway:hover ~ #info-gateway,
    #node-scheduler:hover ~ #info-scheduler,
    #node-redis:hover ~ #info-redis,
    #node-mongodb:hover ~ #info-mongodb {
      opacity: 1;
    }
  </style>

  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="830" height="300" rx="8" fill="url(#bg-gradient)" />
  <rect width="830" height="300" rx="8" fill="url(#grid-pattern)" />

  <!-- Frame -->
  <rect x="5" y="5" width="820" height="290" rx="6" fill="none" class="neon-border" />

  <!-- Title bar -->
  <circle cx="20" cy="20" r="5" fill="#ff5f56" />
  <circle cx="36" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="20" r="5" fill="#27c93f" />
  <text x="415" y="23" text-anchor="middle" class="terminal-header">SYSTEM ARCHITECTURE MAP // DATAFLOW PIPELINE</text>
  <line x1="5" y1="35" x2="825" y2="35" stroke="#36bcf7" stroke-width="1" opacity="0.3" />

  <!-- Connection Pipes -->
  <!-- Static under-lines -->
  <line x1="100" y1="135" x2="280" y2="135" class="static-line" />
  <line x1="280" y1="135" x2="460" y2="80" class="static-line" />
  <line x1="280" y1="135" x2="460" y2="190" class="static-line" />
  <line x1="280" y1="135" x2="640" y2="135" class="static-line" />
  <line x1="460" y1="80" x2="640" y2="135" class="static-line" />
  <line x1="460" y1="190" x2="640" y2="135" class="static-line" />

  <!-- Animated flow pipelines -->
  <path d="M 100 135 L 280 135" fill="none" class="flow-line" />
  <path d="M 280 135 L 460 80" fill="none" class="flow-line" />
  <path d="M 280 135 L 460 190" fill="none" class="flow-line-reverse" />
  <path d="M 280 135 L 640 135" fill="none" class="flow-line" />
  <path d="M 460 80 L 640 135" fill="none" class="flow-line" />
  <path d="M 460 190 L 640 135" fill="none" class="flow-line-reverse" />

  <!-- Node 1: Next.js Client -->
  <g id="node-client" class="node-group">
    <circle cx="100" cy="135" r="28" class="node-bg" />
    <text x="100" y="138" text-anchor="middle" class="node-icon">CLIENT</text>
    <text x="100" y="180" text-anchor="middle" class="node-label">Next.js UI</text>
  </g>

  <!-- Node 2: FastAPI Gateway -->
  <g id="node-gateway" class="node-group">
    <circle cx="280" cy="135" r="28" class="node-bg" />
    <text x="280" y="138" text-anchor="middle" class="node-icon">GATEWAY</text>
    <text x="280" y="180" text-anchor="middle" class="node-label">FastAPI API</text>
  </g>

  <!-- Node 3: APScheduler Worker -->
  <g id="node-scheduler" class="node-group">
    <circle cx="460" cy="80" r="28" class="node-bg" />
    <text x="460" y="83" text-anchor="middle" class="node-icon">DAEMON</text>
    <text x="460" y="125" text-anchor="middle" class="node-label">Scheduler</text>
  </g>

  <!-- Node 4: Redis Cache -->
  <g id="node-redis" class="node-group">
    <circle cx="460" cy="190" r="28" class="node-bg" />
    <text x="460" y="193" text-anchor="middle" class="node-icon">CACHE</text>
    <text x="460" y="235" text-anchor="middle" class="node-label">Redis Cache</text>
  </g>

  <!-- Node 5: MongoDB Database -->
  <g id="node-mongodb" class="node-group">
    <circle cx="640" cy="135" r="28" class="node-bg" />
    <text x="640" y="138" text-anchor="middle" class="node-icon">DATABASE</text>
    <text x="640" y="180" text-anchor="middle" class="node-label">MongoDB</text>
  </g>

  <!-- Shared Console HUD Display (Fades text on hover) -->
  <rect x="25" y="245" width="780" height="42" rx="4" class="console-box" />

  <!-- Default Status Panel -->
  <g id="default-info" class="default-text">
    <text x="50" y="270" fill="#36bcf7" style="animation: pulse 1.5s infinite;">&gt; HOVER SYSTEMS NODES TO ANALYZE ARCHITECTURE TELEMETRY DATAFLOW...</text>
  </g>

  <!-- Info Panel: Client -->
  <g id="info-client" class="info-panel">
    <text x="50" y="262" class="terminal-text" style="font-weight: bold; fill: #36bcf7;">[ NEXT.JS / REACT FRONTEND CORE ]</text>
    <text x="50" y="278" class="terminal-text" style="font-size: 11px; opacity: 0.85;">Hydrated Client UI • Server-Side Rendering (SSR) • Hosted on Vercel Edge Server</text>
  </g>

  <!-- Info Panel: Gateway -->
  <g id="info-gateway" class="info-panel">
    <text x="50" y="262" class="terminal-text" style="font-weight: bold; fill: #36bcf7;">[ FASTAPI CONCURRENCY GATEWAY ]</text>
    <text x="50" y="278" class="terminal-text" style="font-size: 11px; opacity: 0.85;">REST endpoints • WebSockets • UUIDv4 Idempotency Protection • Rate Limiter</text>
  </g>

  <!-- Info Panel: Scheduler -->
  <g id="info-scheduler" class="info-panel">
    <text x="50" y="262" class="terminal-text" style="font-weight: bold; fill: #36bcf7;">[ APSCHEDULER PERIODIC DAEMON ]</text>
    <text x="50" y="278" class="terminal-text" style="font-size: 11px; opacity: 0.85;">Automated price calculations • Volatility Engine • Cron-driven updates every 30s</text>
  </g>

  <!-- Info Panel: Redis -->
  <g id="info-redis" class="info-panel">
    <text x="50" y="262" class="terminal-text" style="font-weight: bold; fill: #36bcf7;">[ REDIS HIGH-SPEED CACHE ]</text>
    <text x="50" y="278" class="terminal-text" style="font-size: 11px; opacity: 0.85;">Session caching • Demand-driven stock volatility indexes • Fast transactional cache</text>
  </g>

  <!-- Info Panel: MongoDB -->
  <g id="info-mongodb" class="info-panel">
    <text x="50" y="262" class="terminal-text" style="font-weight: bold; fill: #36bcf7;">[ MONGO DATABASE CLUSTER ]</text>
    <text x="50" y="278" class="terminal-text" style="font-size: 11px; opacity: 0.85;">ACID-compliant multi-document transactions • Order books • Safe transaction state audits</text>
  </g>
</svg>
